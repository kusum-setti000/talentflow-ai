[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talentflow-ai"
version = "2.0.0"
description = "Evidence-grounded AI candidate screening"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.40,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "langchain-core>=0.3,<2", "langchain-openai>=0.3,<2", "langgraph>=0.2,<2",
  "pymupdf>=1.24,<2", "python-docx>=1.1,<2", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["talentflow*", "ui*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
